        - name: TextImageCta
          noSpace: false
          text: | 
            La sezione **‘Formazione’ di Designers Italia si arricchisce** di un nuovo corso dedicato a chi si occupa di trasformazione digitale nella Pubblica Amministrazione. Il corso **‘Impostare la progettazione di servizi digitali’** aiuta a comprendere come gestire un progetto dalla definizione del perimetro e degli obiettivi fino alle attività necessarie per realizzare servizi digitali di qualità, nel rispetto della normativa e delle Linee guida di design della PA.

            Il nuovo corso completa l’offerta formativa già disponibile con un percorso che propone una **visione d’insieme dei fondamenti per un’impostazione efficace dei progetti di trasformazione digitale**, mettendo in relazione norme, competenze, attività e strumenti. Un approccio utile per chi deve orientarsi nelle fasi iniziali di un progetto e definire le condizioni necessarie per portarlo avanti.      
      
            ## Dalla norma al progetto

            Il percorso è articolato in tre moduli che accompagnano dalla **conoscenza del quadro normativo di riferimento** alla sua applicazione pratica, fornendo i fondamenti per impostare il progetto e **organizzare le attività e gli strumenti** necessari alla sua realizzazione.

            ## Un'offerta formativa sempre più ricca

            Il nuovo corso si aggiunge ai [quattro già disponibili](https://designers.italia.it/formazione/imparare/) grazie all’accordo tra il Dipartimento per la trasformazione digitale e ANCI, che hanno portato **i corsi di formazione di Designers Italia nell’Accademia dei Comuni digitali**. I corsi pubblicati nel 2025 hanno approfondito competenze e attività specifiche per progettare e realizzare servizi digitali, mentre il nuovo percorso si concentra sui fondamenti necessari per **impostarli e gestirli nel rispetto delle norme**.

            Designers Italia mette anche a disposizione [materiali disponibili per insegnare](https://designers.italia.it/formazione/insegnare/) a progettare servizi pubblici digitali. Queste risorse possono essere usate per creare attività didattiche sulla trasformazione digitale della PA, come illustra l’esperienza concreta dell’Università degli Studi della Basilicata per INPS nell’ultimo articolo di approfondimento della community, [segnalato da Designers Italia](https://medium.com/designers-italia/progettare-la-didattica-per-la-trasformazione-digitale-della-pa-265fd5b9ace3).

            ‘Impostare la progettazione di servizi digitali’ è un corso gratuito disponibile sulla piattaforma dell’Accademia dei Comuni digitali.

    

            

