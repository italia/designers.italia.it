  # ///////////////////
  # SECTION EDITORIAL
  # ///////////////////
  sectionsEditorial :

    # —
    # EDITORIAL #C #I
    # —
    - title: Cosa offre il corso #C
      menu: false
      centered: true
      background: null
      #text: | #C
      #  Lorem **ipsum**
      components:

        # TXT BLOCK
        - name: TextImageCta
          text: | #C
             Questo **corso gratuito**, nato dalla collaborazione tra il Dipartimento per la trasformazione digitale e ANCI, è stato pensato per chi lavora per e con i Comuni, ma è **aperto a chiunque** voglia familiarizzare con la progettazione di servizi digitali in ambito pubblico.

             Il corso introduce il quadro normativo e le indicazioni da seguire per progettare e realizzare servizi pubblici digitali e i loro punti di contatto con l’utenza. Verranno illustrate le linee guida, le attività necessarie per soddisfarne i requisiti e gli strumenti progettuali utili a definire il perimetro di progetto e a raggiungere gli obiettivi e gli standard di qualità nazionali. 

             Il corso è erogato sulla **piattaforma dell’Accademia dei Comuni digitali**. 

        # TXT BLOCK
        - name: TextImageCta
          title: Obiettivi formativi #C
          text: | #C
            Alla fine del corso, sarai in grado di:
            - conoscere le Linee guida di design per i siti internet e i servizi digitali della PA e saperle applicare; 
            - definire i requisiti da soddisfare nella progettazione di servizi pubblici digitali e gli obiettivi da raggiungere; 
            - impostare le attività per la progettazione di servizi e touchpoint digitali con cittadini e operatori, sfruttando le risorse open source a disposizione.

        # TXT BLOCK
        - name: TextImageCta
          title: Durata #C
          text: | #C
            3 ore
            
        # TXT BLOCK
        - name: TextImageCta
          noSpace: true
          title: Certificazione #C
          text: | #C
            Il corso prevede un quiz di valutazione finale per il rilascio di un **badge digitale** che attesta le competenze e le conoscenze acquisite. Puoi usare il badge internamente alla tua organizzazione e connetterlo ai tuoi profili social. Non ha valenza come crediti nei concorsi pubblici ma può essere usato dai dipendenti dei Comuni per cumulare ore di formazione obbligatoria.
                  

  # ///////////////////
  # HIGHLIGHT WITH CARDS
  # ///////////////////
  highlightCards:
    id: HC1
    title: I contenuti di questo corso #C
    text: Esplora i temi proposti per familiarizzare con l'ambito della progettazione di servizi pubblici digitali #C
    col4: false
    noSpace: false
    nopadtop: true
    hasCustomCols: true

    # CARDS
    cards: # AUTO?

      # CARD CHILDREN
      - title: "Norme e Linee guida: per realizzare siti e servizi digitali conformi"
        text: | #C
          Scopri il contesto e i principi che guidano la trasformazione digitale della Pubblica Amministrazione. Approfondisci il quadro normativo di riferimento e il ruolo del design nei progetti di siti e servizi digitali, per comprendere come applicare le Linee guida di design della PA fin dalla fase iniziale del progetto.
        # titleSmall: true
        fullHeight: true
        customCol: col-lg-9
        # url: "azione-1/" #M
        rounded: true
        moreInfo: "Docente: Ilaria Scarpellini"
        tag:
          label: Videolezione #C

      # CARD CHILDREN
      - title: "Il manuale operativo: per rendere concrete le Linee guida di design"
        text: | #C
          Approfondisci gli elementi necessari per impostare un progetto di trasformazione digitale, dalla definizione del perimetro e del processo progettuale all'individuazione delle competenze e delle risorse necessarie. Scopri il Manuale operativo di design e gli aspetti chiave da considerare per organizzare e gestire un progetto in modo efficace. 
        # titleSmall: true
        fullHeight: true
        customCol: col-lg-9
        # url: "azione-1/" #M
        rounded: true
        moreInfo: "Docente: Ilaria Scarpellini"
        tag:
          label: Videolezione #C

      # CARD CHILDREN
      - title: "Le risorse per progettare: supporto pratico alle attività di design"
        text: | #C
          Scopri quali attività caratterizzano la progettazione di siti e servizi digitali della PA e quali strumenti puoi utilizzare per svolgerle. Esplora le risorse standard e aperte messe a disposizione da Designers Italia, con raccomandazioni ed esempi concreti per applicarle alle diverse fasi del progetto.
        # titleSmall: true
        fullHeight: true
        customCol: col-lg-9
        # url: "azione-1/" #M
        rounded: true
        moreInfo: "Docente: Ilaria Scarpellini"
        tag:
          label: Intervista #C
     
              
